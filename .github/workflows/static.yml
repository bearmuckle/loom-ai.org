# Build the landing page and the Loom browser client, then deploy both to Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout Loom
        uses: actions/checkout@v4
        with:
          repository: bearmuckle/loom
          ref: main
          path: loom

      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build Loom browser client
        working-directory: loom/crates/loom-ui
        env:
          RUSTC_BOOTSTRAP: "1"
        run: trunk build --release --public-url /client/

      - name: Assemble Pages site
        run: |
          mkdir -p _site/client
          cp index.html _site/index.html
          cp -R loom/crates/loom-ui/dist/. _site/client/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
